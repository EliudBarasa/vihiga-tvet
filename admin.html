<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Vihiga TVET Admin Test</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>

<body>

<h2>Vihiga TVET — Database Test</h2>

<div id="result">Testing Supabase...</div>

<script>

const result = document.getElementById("result");

try {

    const client = supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_PUBLISHABLE_KEY
    );

    async function test(){

        const response = await client
            .from("vtcs")
            .select("id,name")
            .order("name");

        console.log("SUPABASE RESPONSE:", response);

        if(response.error){

            result.innerHTML =
                "<h3>ERROR</h3>" +
                "<pre>" +
                response.error.message +
                "</pre>";

            return;
        }

        const data = response.data || [];

        result.innerHTML =
            "<h3>SUCCESS — " +
            data.length +
            " VTCs found</h3>" +

            "<ol>" +

            data.map(v =>
                "<li>" + v.name + "</li>"
            ).join("") +

            "</ol>";
    }

    test();

} catch(error) {

    result.innerHTML =
        "<h3>JAVASCRIPT ERROR</h3>" +
        "<pre>" +
        error.message +
        "</pre>";

}

</script>

</body>
</html>
