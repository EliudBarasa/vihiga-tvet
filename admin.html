<script>


/* =====================================================
   SUPABASE
====================================================== */

const client =
    supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_PUBLISHABLE_KEY
    );


let rows = [];

let editing = null;


/* =====================================================
   ELEMENTS
====================================================== */

const qEl =
    document.getElementById("q");

const rowsEl =
    document.getElementById("rows");

const editorEl =
    document.getElementById("editor");

const addEl =
    document.getElementById("add");

const logoutEl =
    document.getElementById("logout");

const logoPreview =
    document.getElementById("logoPreview");

const logoFile =
    document.getElementById("logoFile");

const uploadLogoBtn =
    document.getElementById("uploadLogo");

const logoMsg =
    document.getElementById("logoMsg");


/* =====================================================
   LOGO SETTINGS
====================================================== */

const LOGO_BUCKET =
    "vtc-photos";

const LOGO_PATH =
    "website-logo.png";


/* =====================================================
   ADMIN GUARD
====================================================== */

async function guard(){

    const {
        data: {
            user
        },
        error: userError
    } =
        await client.auth.getUser();


    if(
        userError ||
        !user
    ){

        window.location.href =
            "login.html";

        return;
    }


    const {
        data: profile,
        error: profileError
    } =
        await client
            .from("admin_profiles")
            .select("*")
            .eq("id",user.id)
            .eq("is_active",true)
            .single();


    if(
        profileError ||
        !profile
    ){

        await client.auth.signOut();

        window.location.href =
            "login.html";

        return;
    }


    /*
       IMPORTANT:
       Logo loading is completely separate
       from the VTC database loading.
    */

    showCurrentLogo();


    /*
       This is your original VTC loading.
    */

    await load();

}



/* =====================================================
   SHOW CURRENT LOGO
====================================================== */

function showCurrentLogo(){

    const {
        data
    } =
        client.storage
            .from(LOGO_BUCKET)
            .getPublicUrl(LOGO_PATH);


    const logoUrl =
        data.publicUrl;


    logoPreview.innerHTML = `

        <div>

            <strong>
                Current Website Logo
            </strong>

            <br><br>

            <img
                src="${attr(logoUrl)}"
                alt="Vihiga TVET Logo"
                style="
                    width:180px;
                    height:180px;
                    object-fit:contain;
                    background:#ffffff;
                    border:1px solid #ddd;
                    border-radius:12px;
                    padding:10px;
                    display:block;
                "
                onerror="
                    this.style.display='none';
                    document.getElementById('noLogo').style.display='block';
                "
            >

            <p
                id="noLogo"
                style="display:none;"
            >
                No logo has been uploaded yet.
            </p>

        </div>

    `;

}


/* =====================================================
   UPLOAD WEBSITE LOGO
====================================================== */

uploadLogoBtn.addEventListener(
    "click",
    uploadLogo
);


async function uploadLogo(){

    const file =
        logoFile.files[0];


    if(!file){

        logoMsg.textContent =
            "Please select the Vihiga TVET logo first.";

        return;

    }


    const allowedTypes = [
        "image/png",
        "image/jpeg",
        "image/webp"
    ];


    if(
        !allowedTypes.includes(
            file.type
        )
    ){

        logoMsg.textContent =
            "Please upload a PNG, JPG or WEBP image.";

        return;

    }


    if(
        file.size >
        5 * 1024 * 1024
    ){

        logoMsg.textContent =
            "The logo must be smaller than 5 MB.";

        return;

    }


    logoMsg.textContent =
        "Uploading logo…";


    const {
        error
    } =
        await client.storage
            .from(LOGO_BUCKET)
            .upload(
                LOGO_PATH,
                file,
                {
                    cacheControl:"3600",
                    upsert:true,
                    contentType:file.type
                }
            );


    if(error){

        logoMsg.textContent =
            "Logo upload failed: " +
            error.message;

        console.error(
            "LOGO UPLOAD ERROR:",
            error
        );

        return;

    }


    logoMsg.textContent =
        "Logo uploaded successfully.";


    /*
       Refresh preview.
    */

    showCurrentLogo();


    /*
       Clear selected file.
    */

    logoFile.value = "";

}



/* =====================================================
   LOAD VTCs
====================================================== */

async function load(){

    const {
        data,
        error
    } =
        await client
            .from("vtcs")
            .select("*")
            .order("name");


    if(error){

        rowsEl.innerHTML =
            "<div class='notice'>" +
            "<strong>Unable to load VTCs:</strong><br>" +
            esc(error.message) +
            "</div>";

        console.error(
            "VTC LOAD ERROR:",
            error
        );

        return;
    }


    rows =
        data || [];


    renderList();

}



/* =====================================================
   DISPLAY VTC LIST
====================================================== */

function renderList(){

    const search =
        qEl.value
            .trim()
            .toLowerCase();


    const filtered =
        rows.filter(

            v => {

                const text =
                    `${v.name || ""}
                    ${v.sub_county || ""}
                    ${v.ward || ""}`
                    .toLowerCase();


                return text.includes(search);

            }

        );


    rowsEl.innerHTML =

        filtered

            .map(

                v => `

                <button
                    type="button"
                    class="admin-row"
                    onclick="editVTC('${v.id}')"
                >

                    <strong>
                        ${esc(v.name)}
                    </strong>


                    <span>

                        ${esc(
                            v.sub_county || ""
                        )}

                        •

                        ${esc(
                            v.ward || ""
                        )}

                    </span>

                </button>

                `

            )

            .join("")

            ||

            "<p>No centres found.</p>";

}



/* =====================================================
   EDIT VTC
====================================================== */

function editVTC(id){

    editing =
        rows.find(
            v => v.id === id
        );


    if(!editing){
        return;
    }


    showVTCForm(editing);

}



/* =====================================================
   VTC FORM
====================================================== */

function showVTCForm(v = {}){

    editorEl.innerHTML = `

        <h3>

            ${v.id

                : "Add VTC"}

        </h3>


        <form id="vtcForm">


            <label>

                Name

                <input
                    id="name"
                    required
                    value="${attr(
                        v.name || ""
                    )}"
                >

            </label>



            <label>

                Sub-county

                <input
                    id="sub"
                    value="${attr(
                        v.sub_county || ""
                    )}"
                >

            </label>



            <label>

                Ward

                <input
                    id="ward"
                    value="${attr(
                        v.ward || ""
                    )}"
                >

            </label>



            <label>

                Location

                <input
                    id="loc"
                    value="${attr(
                        v.location || ""
                    )}"
                >

            </label>



            <label>

                Phone

                <input
                    id="phone"
                    value="${attr(
                        v.phone || ""
                    )}"
                >

            </label>



            <label>

                WhatsApp

                <input
                    id="wa"
                    value="${attr(
                        v.whatsapp || ""
                    )}"
                >

            </label>



            <label>

                Email

                <input
                    id="email"
                    value="${attr(
                        v.email || ""
                    )}"
                >

            </label>



            <label>

                Principal/Manager

                <input
                    id="principal"
                    value="${attr(
                        v.principal_name || ""
                    )}"
                >

            </label>



            <label>

                TVETA status

                <input
                    id="tveta"
                    value="${attr(
                        v.tveta_status ||
                        "To be verified"
                    )}"
                >

            </label>



            <label>

                Current Enrolment

                <input
                    id="enrolment"
                    type="number"
                    min="0"
                    placeholder="e.g. 150"
                    value="${attr(
                        v.enrolment ?? ""
                    )}"
                >

            </label>



            <label>

                Institution Photo URL

                <input
                    id="photo"
                    type="url"
                    placeholder="https://..."
                    value="${attr(
                        v.photo_url || ""
                    )}"
                >

                <small>
                    Paste a publicly accessible image URL.
                </small>

            </label>



            ${
                v.photo_url

                ?

                `

                <div
                    style="
                        margin:12px 0;
                    "
                >

                    <strong>
                        Current Photo
                    </strong>

                    <br><br>

                    <img
                        src="${attr(v.photo_url)}"
                        alt="${attr(v.name || "VTC photo")}"
                        style="
                            width:100%;
                            max-width:420px;
                            height:220px;
                            object-fit:cover;
                            border-radius:12px;
                            display:block;
                        "
                        onerror="this.style.display='none'"
                    >

                </div>

                `

                :

                ""

            }



            <label>

                Map URL

                <input
                    id="map"
                    value="${attr(
                        v.map_url || ""
                    )}"
                >

            </label>



            <label>

                Description

                <textarea id="desc">${esc(
                    v.description || ""
                )}</textarea>

            </label>



            <label class="check">

                <input
                    id="pub"
                    type="checkbox"
                    ${
                        v.is_published !== false
                        ? "checked"
                        : ""
                    }
                >

                Published

            </label>



            <div class="form-actions">


                <button
                    class="btn primary"
                >

                    Save

                </button>


                ${
                    v.id

                    ?

                    `

                    <button
                        type="button"
                        class="btn danger"
                        id="del"
                    >

                        Delete

                    </button>

                    `

                    :

                    ""

                }


            </div>


            <div id="saveMsg"></div>


        </form>



        ${
            v.id

            ?

            `

            <hr>


            <div class="course-admin">


                <div class="course-admin-head">

                    <h3>
                        Courses
                    </h3>


                    <button
                        type="button"
                        class="btn primary"
                        id="newCourse"
                    >

                        + Add course

                    </button>

                </div>


                <div id="courseRows">

                    <div class="loading">
                        Loading courses…
                    </div>

                </div>


            </div>



            <hr>



            <div class="course-admin">


                <div class="course-admin-head">

                    <h3>
                        Admissions
                    </h3>


                    <button
                        type="button"
                        class="btn primary"
                        id="newAdmission"
                    >

                        + Add intake

                    </button>

                </div>


                <div id="admissionRows">

    document

    if(v.id){


        document
            .getElementById("del")
            .addEventListener(

            );


        document
            .getElementById("newCourse")
            .addEventListener(
                "click",
                () => courseForm(v.id)
            );


        document
            .getElementById("newAdmission")
            .addEventListener(
                "click",
                () => admissionForm(v.id)
            );


        loadCourses(v.id);

        loadAdmissions(v.id);

    }

}



/* =====================================================
   SAVE VTC
====================================================== */

async function saveVTC(e){

    e.preventDefault();


    const obj = {

        name:
            document
                .getElementById("name")
                .value
                .trim(),


        sub_county:
            document
                .getElementById("sub")
                .value
                .trim(),


        ward:
            document
                .getElementById("ward")
                .value
                .trim(),


        location:
            document
                .getElementById("loc")
                .value
                .trim(),


        phone:
            document
                .getElementById("phone")
                .value
                .trim(),


        whatsapp:
            document
                .getElementById("wa")
                .value
                .trim(),


        email:
            document
                .getElementById("email")
                .value
                .trim(),


        principal_name:
            document
                .getElementById("principal")
                .value
                .trim(),


        tveta_status:
            document
                .getElementById("tveta")
                .value
                .trim(),


        enrolment:
            Number(
                document
                    .getElementById("enrolment")
                    .value
            ) || 0,


        photo_url:
            document
                .getElementById("photo")
                .value
                .trim(),


        map_url:
            document
                .getElementById("map")
                .value
                .trim(),


        description:
            document
                .getElementById("desc")
                .value
                .trim(),


        is_published:
            document
                .getElementById("pub")
                .checked,


        updated_at:
            new Date().toISOString()

    };


    let result;


    if(editing){

        result =
            await client
                .from("vtcs")
                .update(obj)
                .eq(
                    "id",
                    editing.id
                );

    }

    else{

        result =
            await client
                .from("vtcs")
                .insert(obj);

    }


    const msgEl =
        document.getElementById(
            "saveMsg"
        );


    if(result.error){

        msgEl.textContent =
            result.error.message;

        return;

    }


    const savedId =
        editing
            ? editing.id
            : null;


    await load();


    if(savedId){

        editVTC(savedId);

    }

    else{

        editing = null;

        editorEl.innerHTML = `

            <h3>
                Saved
            </h3>

            <p>
                Select the new VTC to add
                courses and admissions.
            </p>

        `;

    }

}



/* =====================================================
   DELETE VTC
====================================================== */

async function deleteVTC(){

    if(!editing){
        return;
    }


    if(
        !confirm(
            "Delete this VTC and its courses?"
        )
    ){

        return;

    }


    const {
        error
    } =
        await client
            .from("vtcs")
            .delete()
            .eq(
                "id",
                editing.id
            );


    if(error){

        document
            .getElementById(
                "saveMsg"
            )
            .textContent =
            error.message;

        return;

    }


    editing = null;

    await load();


    editorEl.innerHTML = `

        <h3>
            Deleted
        </h3>

        <p>
            Select another VTC.
        </p>

    `;

}



/* =====================================================
   COURSES
====================================================== */

async function loadCourses(vtcId){

    const {
        data,
        error
    } =
        await client
            .from("courses")
            .select("*")
            .eq(
                "vtc_id",
                vtcId
            )
            .order("name");


    const el =
        document.getElementById(
            "courseRows"
        );


    if(!el){
        return;
    }


    if(error){

        el.innerHTML =
            `<div class="notice">
                Unable to load courses:
                ${esc(error.message)}
            </div>`;

        return;

    }


    el.innerHTML =

        (data || [])

            .map(

                x => `

                <div
                    class="course-admin-row"
                >

                    <div>

                        <b>
                            ${esc(x.name)}
                        </b>

                        <span>

                            ${esc(
                                x.level ||
                                "Level not specified"
                            )}

                            •

                            ${esc(
                                x.duration ||
                                "Duration not specified"
                            )}

                        </span>

                    </div>


                    <div>

                        <button
                            type="button"
                            class="mini"
                            onclick="
                                courseForm(
                                    '${x.vtc_id}',
                                    '${x.id}'
                                )
                            "
                        >

                            Edit

                        </button>


                        <button
                            type="button"
                            class="mini danger-mini"
                            onclick="
                                deleteCourse(
                                    '${x.id}',
                                    '${x.vtc_id}'
                                )
                            "
                        >

                            Delete

                        </button>

                    </div>

                </div>

                `

            )

            .join("")

            ||

            "<p>No courses added yet.</p>";

}



/* =====================================================
   COURSE FORM
====================================================== */

async function courseForm(
    vtcId,
    courseId = null
){

    let x = {};


    if(courseId){

        const {
            data
        } =
            await client
                .from("courses")
                .select("*")
                .eq(
                    "id",
                    courseId
                )
                .single();


        x =
            data || {};

    }


    const rowsEl =
        document.getElementById(
            "courseRows"
        );


    rowsEl.innerHTML = `

        <form
            id="courseForm"
            class="course-form"
        >

            <h4>

                ${
                    courseId
                    ? "Edit course"
                    : "Add course"
                }

            </h4>


            <label>

                Course name

                <input
                    id="cn"
                    required
                    value="${attr(
                        x.name || ""
                    )}"
                >

            </label>


            <label>

                Level

                <input
                    id="cl"
                    placeholder="e.g. Level 4"
                    value="${attr(
                        x.level || ""
                    )}"
                >

            </label>


            <label>

                Duration

                <input
                    id="cd"
                    placeholder="e.g. 2 years"
                    value="${attr(
                        x.duration || ""
                    )}"
                >

            </label>


            <label>

                Description

                <textarea id="cx">${esc(
                    x.description || ""
                )}</textarea>

            </label>


            <label class="check">

                <input
                    id="ca"
                    type="checkbox"
                    ${
                        x.is_active !== false
                        ? "checked"
                        : ""
                    }
                >

                Active

            </label>


            <div class="form-actions">

                <button
                    class="btn primary"
                >

                    Save course

                </button>


                <button
                    type="button"
                    class="btn secondary"
                    id="cancelCourse"
                >

                    Cancel

                </button>

            </div>


            <div id="courseMsg"></div>

        </form>

    `;



    document
        .getElementById("courseForm")
        .addEventListener(
            "submit",
            async e => {

                e.preventDefault();


                const obj = {

                    vtc_id:
                        vtcId,


                    name:
                        document
                            .getElementById("cn")
                            .value
                            .trim(),


                    level:
                        document
                            .getElementById("cl")
                            .value
                            .trim(),


                    duration:
                        document
                            .getElementById("cd")
                            .value
                            .trim(),


                    description:
                        document
                            .getElementById("cx")
                            .value
                            .trim(),


                    is_active:
                        document
                            .getElementById("ca")
                            .checked

                };


                const result =
                    courseId

                    ?

                    await client
                        .from("courses")
                        .update(obj)
                        .eq(
                            "id",
                            courseId
                        )

                    :

                    await client
                        .from("courses")
                        .insert(obj);


                if(result.error){

                    document
                        .getElementById(
                            "courseMsg"
                        )
                        .textContent =
                        result.error.message;

                    return;

                }


                await loadCourses(
                    vtcId
                );

            }
        );


    document
        .getElementById(
            "cancelCourse"
        )
        .addEventListener(
            "click",
            () =>
                loadCourses(vtcId)
        );

}



/* =====================================================
   DELETE COURSE
====================================================== */

async function deleteCourse(
    id,
    vtcId
){

    if(
        !confirm(
            "Delete this course?"
        )
    ){

        return;

    }


    const {
        error
    } =
        await client
            .from("courses")
            .delete()
            .eq(
                "id",
                id
            );


    if(error){

        alert(error.message);

        return;

    }


    await loadCourses(
        vtcId
    );

}



/* =====================================================
   ADMISSIONS
====================================================== */

async function loadAdmissions(
    vtcId
){

    const {
        data,
        error
    } =
        await client
            .from("admissions")
            .select("*")
            .eq(
                "vtc_id",
                vtcId
            )
            .order(
                "deadline",
                {
                    ascending:true
                }
            );


    const el =
        document.getElementById(
            "admissionRows"
        );


    if(!el){
        return;
    }


    if(error){

        el.innerHTML =
            `<div class="notice">
                Unable to load admissions:
                ${esc(error.message)}
            </div>`;

        return;

    }


    el.innerHTML =

        (data || [])

            .map(

                x => `

                <div
                    class="course-admin-row"
                >

                    <div>

                        <b>

                            ${esc(
                                x.title ||
                                "Admission"
                            )}

                        </b>


                        <span>

                            ${esc(
                                x.intake ||
                                "Intake"
                            )}

                            •

                            ${esc(
                                x.status ||
                                "Closed"
                            )}

                            •

                            ${esc(
                                x.deadline ||
                                "No deadline"
                            )}

                        </span>

                    </div>


                    <div>

                        <button
                            type="button"
                            class="mini"
                            onclick="
                                admissionForm(
                                    '${x.vtc_id}',
                                    '${x.id}'
                                )
                            "
                        >

                            Edit

                        </button>


                        <button
                            type="button"
                            class="mini danger-mini"
                            onclick="
                                deleteAdmission(
                                    '${x.id}',
                                    '${x.vtc_id}'
                                )
                            "
                        >

                            Delete

                        </button>

                    </div>

                </div>

                `

            )

            .join("")

            ||

            "<p>No admission/intake information added yet.</p>";

}



/* =====================================================
   ADMISSION FORM
====================================================== */

async function admissionForm(
    vtcId,
    admissionId = null
){

    let x = {

        title:"",
        status:"Closed",
        intake:"",
        deadline:"",
        application_fee:"",
        tuition_fee:"",
        entry_requirements:"",
        instructions:"",
        contact:"",
        application_url:""

    };


    if(admissionId){

        const {
            data,
            error
        } =
            await client
                .from("admissions")
                .select("*")
                .eq(
                    "id",
                    admissionId
                )
                .single();


        if(
            !error &&
            data
        ){

            x =
                data;

        }

    }


    const el =
        document.getElementById(
            "admissionRows"
        );


    el.innerHTML = `

        <form
            id="admissionForm"
            class="course-form"
        >

            <h4>

                ${
                    admissionId
                    ? "Edit intake"
                    : "Add intake"
                }

            </h4>


            <label>

                Admission / Course Title

                <input
                    id="at"
                    required
                    placeholder="e.g. ICT Level 4"
                    value="${attr(
                        x.title || ""
                    )}"
                >

            </label>


            <label>

                Status

                <select id="as">

                    <option
                        value="Open"
                        ${
                            x.status === "Open"
                            ? "selected"
                            : ""
                        }
                    >
                        Open
                    </option>


                    <option
                        value="Closed"
                        ${
                            x.status === "Closed"
                            ? "selected"
                            : ""
                        }
                    >
                        Closed
                    </option>

                </select>

            </label>


            <label>

                Intake

                <input
                    id="ai"
                    required
                    placeholder="e.g. September 2026"
                    value="${attr(
                        x.intake || ""
                    )}"
                >

            </label>


            <label>

                Application deadline

                <input
                    id="ad"
                    type="date"
                    value="${attr(
                        x.deadline || ""
                    )}"
                >

            </label>


            <label>

                Application fee

                <input
                    id="af"
                    placeholder="e.g. KSh 500"
                    value="${attr(
                        x.application_fee || ""
                    )}"
                >

            </label>


            <label>

                Tuition / fee information

                <input
                    id="tf"
                    placeholder="e.g. See course fee schedule"
                    value="${attr(
                        x.tuition_fee || ""
                    )}"
                >

            </label>


            <label>

                Entry requirements

                <textarea id="er">${esc(
                    x.entry_requirements || ""
                )}</textarea>

            </label>


            <label>

                Application instructions

                <textarea id="ix">${esc(
                    x.instructions || ""
                )}</textarea>

            </label>


            <label>

                Admissions contact

                <input
                    id="ac"
                    value="${attr(
                        x.contact || ""
                    )}"
                >

            </label>


            <label>

                Application link

                <input
                    id="al"
                    type="url"
                    placeholder="https://…"
                    value="${attr(
                        x.application_url || ""
                    )}"
                >

            </label>


            <div class="form-actions">

                <button
                    class="btn primary"
                >

                    Save intake

                </button>


                <button
                    type="button"
                    class="btn secondary"
                    id="cancelAdmission"
                >

                    Cancel

                </button>

            </div>


            <div id="admissionMsg"></div>

        </form>

    `;



    document
        .getElementById(
            "admissionForm"
        )
        .addEventListener(
            "submit",
            async e => {

                e.preventDefault();


                const obj = {

                    title:
                        document
                            .getElementById("at")
                            .value
                            .trim(),


                    vtc_id:
                        vtcId,


                    status:
                        document
                            .getElementById("as")
                            .value,


                    intake:
                        document
                            .getElementById("ai")
                            .value
                            .trim(),


                    deadline:
                        document
                            .getElementById("ad")
                            .value
                            ||
                            null,


                    application_fee:
                        document
                            .getElementById("af")
                            .value
                            .trim(),


                    tuition_fee:
                        document
                            .getElementById("tf")
                            .value
                            .trim(),


                    entry_requirements:
                        document
                            .getElementById("er")
                            .value
                            .trim(),


                    instructions:
                        document
                            .getElementById("ix")
                            .value
                            .trim(),


                    contact:
                        document
                            .getElementById("ac")
                            .value
                            .trim(),


                    application_url:
                        document
                            .getElementById("al")
                            .value
                            .trim()

                };


                if(!obj.title){

                    document
                        .getElementById(
                            "admissionMsg"
                        )
                        .textContent =
                        "Please enter the Admission / Course Title.";

                    return;

                }


                const result =

                    admissionId

                    ?

                    await client
                        .from("admissions")
                        .update(obj)
                        .eq(
                            "id",
                            admissionId
                        )

                    :

                    await client
                        .from("admissions")
                        .insert(obj);


                if(result.error){

                    document
                        .getElementById(
                            "admissionMsg"
                        )
                        .textContent =
                        result.error.message;

                    return;

                }


                await loadAdmissions(
                    vtcId
                );

            }
        );


    document
        .getElementById(
            "cancelAdmission"
        )
        .addEventListener(
            "click",
            () =>
                loadAdmissions(vtcId)
        );

}



/* =====================================================
   DELETE ADMISSION
====================================================== */

async function deleteAdmission(
    id,
    vtcId
){

    if(
        !confirm(
            "Delete this admission record?"
        )
    ){

        return;

    }


    const {
        error
    } =
        await client
            .from("admissions")
            .delete()
            .eq(
                "id",
                id
            );


    if(error){

        alert(error.message);

        return;

    }


    await loadAdmissions(
        vtcId
    );

}



/* =====================================================
   ESCAPE
====================================================== */

function esc(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,

            character => ({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            })[character]

        );

}


function attr(value){

    return esc(value);

}
