<!doctype html>
<html lang="en">
<head>

<script src="config.js"></script>
</head>

<body>

<header class="site-header">
<div class="container nav">

<a class="brand" href="index.html">
<span class="brand-mark">VT</span>
<span>
<strong>Vihiga TVET</strong>
<small>Admin Dashboard</small>
</span>
</a>

<button id="logout" class="btn secondary">Sign out</button>

</div>
</header>


<main class="section">

<div class="container">

<div class="section-head">

<div>
<span class="eyebrow">ADMINISTRATION</span>
<h2>VTC Directory</h2>
</div>

<button id="add" class="btn primary">+ Add VTC</button>

</div>


<div class="admin-grid">

<section>

<input
id="q"
class="wide-input"
placeholder="Search VTCs…"
>

<div id="rows" class="admin-list"></div>

</section>


<aside class="editor" id="editor">

<h3>Select a VTC</h3>

<p>
Choose a centre to edit, or tap “Add VTC”.
</p>

</aside>

</div>

</div>

</main>


<script>

const {createClient}=supabase;

const c=createClient(
window.SUPABASE_URL,
window.SUPABASE_PUBLISHABLE_KEY
);

let rows=[];
let editing=null;


/* =========================
   ADMIN LOGIN
========================= */

async function guard(){

const {data:{user}}=await c.auth.getUser();

if(!user){

location.href='login.html';

return;

}

const {data:p,error}=await c
.from('admin_profiles')
.select('*')
.eq('id',user.id)
.eq('is_active',true)
.single();

if(error||!p){

await c.auth.signOut();

location.href='login.html';

return;

}

load();

}


/* =========================
   LOAD VTCS
========================= */

async function load(){

const {data,error}=await c
.from('vtcs')
.select('*')
.order('name');

if(error){

alert(error.message);

return;

}

rows=data||[];

renderList();

}


/* =========================
   VTC LIST
========================= */

function renderList(){

const search=document
.getElementById('q')
.value
.toLowerCase();

document.getElementById('rows').innerHTML=

rows
.filter(v=>
`${v.name} ${v.sub_county||''} ${v.ward||''}`
.toLowerCase()
.includes(search)
)

.map(v=>`

<button
class="admin-row"
onclick="edit('${v.id}')"
>

<strong>${esc(v.name)}</strong>

<span>
${esc(v.sub_county||'')}
•
${esc(v.ward||'')}
</span>

</button>

`)
.join('')

||'<p>No centres found.</p>';

}
