<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vihiga TVET Admin</title><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body>
<header class="site-header"><div class="container nav">
<a class="brand" href="index.html"><span class="brand-mark">VT</span><span><strong>Vihiga TVET</strong><small>Admin Dashboard</small></span></a>
<button id="logout" class="btn secondary">Sign out</button></div></header>
<main class="section"><div class="container">
<div class="section-head"><div><span class="eyebrow">ADMINISTRATION</span><h2>VTC Directory</h2></div><button id="add" class="btn primary">+ Add VTC</button></div>
<div class="admin-grid">
<section><input id="q" class="wide-input" placeholder="Search VTCs…"><div id="rows" class="admin-list"></div></section>
<aside class="editor" id="editor"><h3>Select a VTC</h3><p>Choose a centre to edit, or tap “Add VTC”.</p></aside>
</div></div></main>
<script>
const {createClient}=supabase;const c=createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);let rows=[],editing=null;
async function guard(){const {data:{user}}=await c.auth.getUser();if(!user){location.href='login.html';return}const {data:p,error}=await c.from('admin_profiles').select('*').eq('id',user.id).eq('is_active',true).single();if(error||!p){await c.auth.signOut();location.href='login.html';return}load()}
async function load(){const {data,error}=await c.from('vtcs').select('*').order('name');if(error){alert(error.message);return}rows=data||[];renderList()}
function renderList(){const q=document.getElementById('q').value.toLowerCase();document.getElementById('rows').innerHTML=rows.filter(v=>`${v.name} ${v.sub_county||''} ${v.ward||''}`.toLowerCase().includes(q)).map(v=>`<button class="admin-row" onclick="edit('${v.id}')"><strong>${esc(v.name)}</strong><span>${esc(v.sub_county||'')} • ${esc(v.ward||'')}</span></button>`).join('')||'<p>No centres found.</p>'}
function edit(id){editing=rows.find(v=>v.id===id);form(editing)}
function form(v={}){editor.innerHTML=`<h3>${v.id?'Edit VTC':'Add VTC'}</h3><form id="vtcForm">
<label>Name<input id="name" required value="${attr(v.name||'')}"></label><label>Sub-county<input id="sub" value="${attr(v.sub_county||'')}"></label>
<label>Ward<input id="ward" value="${attr(v.ward||'')}"></label><label>Location<input id="loc" value="${attr(v.location||'')}"></label>
<label>Phone<input id="phone" value="${attr(v.phone||'')}"></label><label>WhatsApp<input id="wa" value="${attr(v.whatsapp||'')}"></label>
<label>Email<input id="email" value="${attr(v.email||'')}"></label><label>Principal/Manager<input id="principal" value="${attr(v.principal_name||'')}"></label>
<label>TVETA status<input id="tveta" value="${attr(v.tveta_status||'To be verified')}"></label><label>Map URL<input id="map" value="${attr(v.map_url||'')}"></label>
<label>Description<textarea id="desc">${esc(v.description||'')}</textarea></label><label class="check"><input id="pub" type="checkbox" ${v.is_published!==false?'checked':''}> Published</label>
<div class="form-actions"><button class="btn primary">Save</button>${v.id?'<button type="button" class="btn danger" id="del">Delete</button>':''}</div><div id="saveMsg"></div></form>
${v.id?`<hr><div class="course-admin"><div class="course-admin-head"><h3>Courses</h3><button type="button" class="btn primary" id="newCourse">+ Add course</button></div><div id="courseRows"><div class="loading">Loading courses…</div></div></div>`:''}`;
document.getElementById('vtcForm').onsubmit=save;if(v.id){document.getElementById('del').onclick=del;loadCourses(v.id);document.getElementById('newCourse').onclick=()=>courseForm(v.id)}
}
async function save(e){e.preventDefault();const obj={name:name.value,sub_county:sub.value,ward:ward.value,location:loc.value,phone:phone.value,whatsapp:wa.value,email:email.value,principal_name:principal.value,tveta_status:tveta.value,map_url:map.value,description:desc.value,is_published:pub.checked,updated_at:new Date().toISOString()};let res=editing?await c.from('vtcs').update(obj).eq('id',editing.id):await c.from('vtcs').insert(obj);if(res.error){saveMsg.textContent=res.error.message;return}saveMsg.textContent='Saved successfully.';const savedId=editing&&editing.id;await load();if(savedId)edit(savedId);else{editing=null;editor.innerHTML='<h3>Saved</h3><p>Select the new VTC to add courses.</p>'}}
async function del(){if(!confirm('Delete this VTC and its courses?'))return;const {error}=await c.from('vtcs').delete().eq('id',editing.id);if(error){saveMsg.textContent=error.message;return}editing=null;await load();editor.innerHTML='<h3>Deleted</h3><p>Select another VTC.</p>'}
async function loadCourses(vtcId){const {data,error}=await c.from('courses').select('*').eq('vtc_id',vtcId).order('name');const el=document.getElementById('courseRows');if(error){el.innerHTML='<div class="notice">Unable to load courses: '+esc(error.message)+'</div>';return}el.innerHTML=(data||[]).map(x=>`<div class="course-admin-row"><div><b>${esc(x.name)}</b><span>${esc(x.level||'Level not specified')} • ${esc(x.duration||'Duration not specified')}</span></div><div><button type="button" class="mini" onclick="courseForm('${x.vtc_id}','${x.id}')">Edit</button><button type="button" class="mini danger-mini" onclick="deleteCourse('${x.id}','${x.vtc_id}')">Delete</button></div></div>`).join('')||'<p>No courses added yet.</p>'}
async function courseForm(vtcId,courseId=null){let x={};if(courseId){const {data}=await c.from('courses').select('*').eq('id',courseId).single();x=data||{}}document.getElementById('courseRows').innerHTML=`<form id="courseForm" class="course-form"><h4>${courseId?'Edit course':'Add course'}</h4><label>Course name<input id="cn" required value="${attr(x.name||'')}"></label><label>Level<input id="cl" placeholder="e.g. Level 4" value="${attr(x.level||'')}"></label><label>Duration<input id="cd" placeholder="e.g. 2 years" value="${attr(x.duration||'')}"></label><label>Description<textarea id="cx">${esc(x.description||'')}</textarea></label><label class="check"><input id="ca" type="checkbox" ${x.is_active!==false?'checked':''}> Active</label><div class="form-actions"><button class="btn primary">Save course</button><button type="button" class="btn secondary" id="cancelCourse">Cancel</button></div><div id="courseMsg"></div></form>`;
document.getElementById('courseForm').onsubmit=async e=>{e.preventDefault();const obj={vtc_id:vtcId,name:cn.value,level:cl.value,duration:cd.value,description:cx.value,is_active:ca.checked};const r=courseId?await c.from('courses').update(obj).eq('id',courseId):await c.from('courses').insert(obj);if(r.error){courseMsg.textContent=r.error.message;return}await loadCourses(vtcId)};document.getElementById('cancelCourse').onclick=()=>loadCourses(vtcId)}
async function deleteCourse(id,vtcId){if(!confirm('Delete this course?'))return;const {error}=await c.from('courses').delete().eq('id',id);if(error){alert(error.message);return}loadCourses(vtcId)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function attr(s){return esc(s)}
q.oninput=renderList;add.onclick=()=>{editing=null;form()};logout.onclick=async()=>{await c.auth.signOut();location.href='login.html'};guard();
</script></body></html>
