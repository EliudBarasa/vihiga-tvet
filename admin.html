>

</div>

<script>

const {createClient}=supabase;

const c=createClient(
window.SUPABASE_URL,
window.SUPABASE_PUBLISHABLE_KEY
);

let rows=[],editing=null;


async function guard(){

const {data:{user}}=await c.auth.getUser();

if(!user){

location.href='login.html';

return;

}

const {data:p,error}=await c
.from('admin_profiles')
.select('*')
.eq('id',user.id)
.eq('is_active',true)
.single();

if(error||!p){

await c.auth.signOut();

location.href='login.html';

return;

}

load();

}

async function load(){

const {data,error}=await c
.from('vtcs')
.select('*')
.order('name');

if(error){
    alert("VTC DATABASE ERROR: " + error.message);
    console.error(error);
    return;
}

alert("VTCs found: " + (data ? data.length : 0));

rows=data||[];
renderList();

}
asyn

}


function renderList(){

const q=document
.getElementById('q')
.value
.toLowerCase();

document.getElementById('rows').innerHTML=

rows
.filter(v=>
`${v.name} ${v.sub_county||''} ${v.ward||''}`
.toLowerCase()
.includes(q)
)

.map(v=>`

<button
class="admin-row"
onclick="edit('${v.id}')"
>

<strong>${esc(v.name)}</strong>

<span>
${esc(v.sub_county||'')}
•
${esc(v.ward||'')}
</span>

</button>

`)
.join('')

||'<p>No centres found.</p>';

}


function edit(id){

editing=rows.find(v=>v.id===id);

form(editing);

}
