<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>
VTC Profile | Vihiga TVET
</title>

<link
    rel="stylesheet"
    href="styles.css"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

</head>


<body>


<header class="site-header">

<div class="container nav">

<a
    class="brand"
    href="index.html"
>

<span class="brand-mark">
VT
</span>

<span>

<strong>
Vihiga TVET
</strong>

<small>
VTC Profile
</small>

</span>

</a>


<nav>

<a href="index.html#directory">
Directory
</a>

<a href="login.html">
Admin
</a>

</nav>

</div>

</header>



<main class="section">

<div
    class="container narrow"
    id="profile"
>

<div class="loading">
Loading profile…
</div>

</div>

</main>



<script>


const {createClient} =
    supabase;


const c =
    createClient(
        window.SUPABASE_URL,
        window.SUPABASE_PUBLISHABLE_KEY
    );


const id =
    new URLSearchParams(
        location.search
    ).get("id");



async function load(){

    if(!id){

        profile.innerHTML =
            '<div class="empty">No VTC selected.</div>';

        return;

    }



    /* ================================
       VTC
    ================================= */

    const {
        data:v,
        error
    } =
        await c
            .from("vtcs")
            .select("*")
            .eq(
                "id",
                id
            )
            .eq(
                "is_published",
                true
            )
            .single();


    if(
        error ||
        !v
    ){

        profile.innerHTML =
            '<div class="empty">VTC profile not found.</div>';

        return;

    }



    /* ================================
       COURSES
    ================================= */

    const {
        data:courses,
        error:ce
    } =
        await c
            .from("courses")
            .select("*")
            .eq(
                "vtc_id",
                id
            )
            .eq(
                "is_active",
                true
            )
            .order("name");



    /* ================================
       ADMISSIONS
    ================================= */

    const {
        data:admissions,
        error:ae
    } =
        await c
            .from("admissions")
            .select("*")
            .eq(
                "vtc_id",
                id
            )
            .order(
                "deadline",
                {
                    ascending:true
                }
            );



    /* ================================
       ENROLMENT
    ================================= */

    const enrolment =
        Number(
            v.enrolment || 0
        );


    const enrolmentDisplay =
        enrolment.toLocaleString();



    /* ================================
       PHOTO
    ================================= */

    const photo =
        v.photo_url
            ? `

                <div
                    style="
                        margin:0 0 30px 0;
                    "
                >

                    <img
                        src="${escAttr(v.photo_url)}"
                        alt="${escAttr(
                            v.name +
                            " institution photo"
                        )}"
                        style="
                            width:100%;
                            max-height:420px;
                            object-fit:cover;
                            border-radius:16px;
                            display:block;
                        "
                        onerror="
                            this.style.display='none';
                        "
                    >

                </div>

            `
            : "";



    /* ================================
       PROFILE
    ================================= */

    profile.innerHTML = `


        ${photo}



        <span class="eyebrow">

            ${esc(
                v.sub_county ||
                "VIHIGA COUNTY"
            )}

        </span>



        <h1>

            ${esc(v.name)}

        </h1>



        <p class="hero-copy">

            📍

            ${esc(
                v.ward ||
                v.location ||
                "Location to be confirmed"
            )}

        </p>



        <!-- ============================
             INFORMATION
        ============================= -->

        <div class="profile-grid">


            <div>

                <b>
                    TVETA status
                </b>

                <span>

                    ${esc(
                        v.tveta_status ||
                        "To be verified"
                    )}

                </span>

            </div>



            <div>

                <b>
                    Principal/Manager
                </b>

                <span>

                    ${esc(
                        v.principal_name ||
                        "Not published"
                    )}

                </span>

            </div>



            <div>

                <b>
                    Phone
                </b>

                <span>

                    ${esc(
                        v.phone ||
                        "Not published"
                    )}

                </span>

            </div>



            <div>

                <b>
                    WhatsApp
                </b>

                <span>

                    ${esc(
                        v.whatsapp ||
                        "Not published"
                    )}

                </span>

            </div>



            <div>

                <b>
                    Current Enrolment
                </b>

                <span>

                    ${enrolmentDisplay}

                    trainees

                </span>

            </div>


        </div>



        <!-- ============================
             COURSES
        ============================= -->

        <h2>
            Courses Offered
        </h2>



        <div class="course-list">


            ${
                ce

                ?

                '<div class="notice">Courses could not be loaded.</div>'

                :

                (

                    (courses || [])

                    .map(

                        x => `

                        <article
                            class="course-item"
                        >

                            <div>

                                <b>
                                    ${esc(x.name)}
                                </b>

                                <span>

                                    ${esc(
                                        x.level ||
                                        "Level not specified"
                                    )}

                                </span>

                            </div>


                            <span>

                                ${esc(
                                    x.duration ||
                                    "Duration not specified"
                                )}

                            </span>

                        </article>

                        `

                    )

                    .join("")

                    ||

                    '<div class="empty">Courses are being updated.</div>'

                )

            }


        </div>



        <!-- ============================
             ADMISSIONS
        ============================= -->

        <h2>
            Admissions
        </h2>



        <div
            id="admissions"
            class="course-list"
        >


            ${
                ae

                ?

                '<div class="notice">Admissions information could not be loaded.</div>'

                :

                (

                    (admissions || [])

                    .map(

                        x => `

                        <article
                            class="course-item admission-item"
                        >

                            <div>

                                <b>

                                    ${esc(
                                        x.intake ||
                                        "Admission"
                                    )}

                                </b>


                                <span>

                                    ${esc(
                                        x.status ||
                                        "Closed"
                                    )}

                                    ${
                                        x.deadline

                                        ?

                                        " • Deadline: " +
                                        esc(
                                            x.deadline
                                        )

                                        :

                                        ""

                                    }

                                </span>


                                <small>

                                    ${esc(
                                        x.entry_requirements ||
                                        ""
                                    )}

                                </small>

                            </div>


                            <div>

                                ${
                                    x.application_url

                                    ?

                                    `

                                    <a
                                        class="btn primary"
                                        href="${escAttr(
                                            x.application_url
                                        )}"
                                        target="_blank"
                                        rel="noopener"
                                    >

                                        Apply now

                                    </a>

                                    `

                                    :

                                    ""

                                }

                            </div>

                        </article>

                        `

                    )

                    .join("")

                    ||

                    '<div class="empty">Admission information is being updated.</div>'

                )

            }


        </div>



        <!-- ============================
             ABOUT
        ============================= -->

        <h2>
            About the VTC
        </h2>



        <p>

            ${esc(
                v.description ||
                "Profile information is being developed."
            )}

        </p>



        ${
            v.map_url

            ?

            `

            <a
                class="btn primary"
                href="${escAttr(v.map_url)}"
                target="_blank"
                rel="noopener"
            >

                Open location

            </a>

            `

            :

            ""

        }



        <p
            style="
                margin-top:30px
            "
        >

            <a
                href="index.html#directory"
            >

                ← Back to directory

            </a>

        </p>


    `;

}



/* ================================
   ESCAPE HTML
================================ */

function esc(s){

    return String(
        s ?? ""
    )
    .replace(
        /[&<>"']/g,

        c => ({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[c])

    );

}


function escAttr(s){

    return esc(s);

}



/* ================================
   START
================================ */

load();

</script>


</body>

</html>
