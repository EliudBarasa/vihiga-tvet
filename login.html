<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Vihiga TVET</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body class="login-page"><div class="login-card"><a class="brand" href="index.html"><span class="brand-mark">VT</span><span><strong>Vihiga TVET</strong><small>Administrator</small></span></a><h1>Admin Login</h1><p>Sign in to manage the VTC directory.</p><form id="form"><input id="email" type="email" placeholder="Email address" required><input id="password" type="password" placeholder="Password" required><button class="btn primary" type="submit">Sign in</button><div id="msg"></div></form><a href="index.html" class="back">← Back to directory</a></div><script>const {createClient}=supabase;const c=createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';const {error}=await c.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}location.href='admin.html'});</script></body></html>
